version: '3'

vars:
  CACHE_PATH: ".zig-cache"
  PACKAGE_PATH: "zig-pkg"
  OUTPUT_PATH: "zig-out"

tasks:
  clean:
    cmds:
      - rm -rf {{.CACHE_PATH}} {{.PACKAGE_PATH}} {{.OUTPUT_PATH}}

  watch:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - zig build -fincremental --watch

  watchrun:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - zig build -fincremental --watch run

  build:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - zig build -Doptimize=${ZIG_BUILD_MODE}

  debug:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - zig build -Doptimize=Debug

  run:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - ./main {{.CLI_ARGS}}

  test:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - ./main {{.CLI_ARGS}}
