version: '3'

vars:
  CACHE_PATH: ".zig-cache"
  OUTPUT_PATH: "zig-out"

tasks:
  clean:
    cmds:
      - rm -rf {{.CACHE_PATH}} {{.OUTPUT_PATH}}

  build:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - zig cc -o libmath.so -shared -fPIC ../math.c
      - patchelf --set-soname libmath.so libmath.so
      - zig build-exe ../main.zig -femit-bin=lib-cc-shared -fstrip -L. -lmath -O ReleaseSmall -target native -mcpu=baseline

  debug:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - zig cc -o libmath.so -shared -fPIC ../math.c
      - patchelf --set-soname libmath.so libmath.so
      - zig build-exe ../main.zig -femit-bin=lib-cc-shared -L. -lmath -O Debug

  run:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - ./lib-cc-shared {{.CLI_ARGS}}
