version: '3'

vars:
  CACHE_PATH: ".zig-cache"
  OUTPUT_PATH: "zig-out"

tasks:
  clean:
    cmds:
      - rm -rf {{.CACHE_PATH}} {{.OUTPUT_PATH}}

  build:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - zig build-lib ../root.zig -femit-bin=liblib-static.a -static -O ReleaseSmall -target native -mcpu=baseline
      - zig build-exe ../main.zig -femit-bin=lib-static -static -fstrip -L. -llib-static -O ReleaseSmall -target native -mcpu=baseline

  run:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - ./lib-static {{.CLI_ARGS}}
