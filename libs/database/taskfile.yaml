version: "3"

vars:
  CACHE_PATH: ".zig-cache"
  OUTPUT_PATH: "zig-out"

tasks:
  clean:
    cmds:
      - rm -rf {{.CACHE_PATH}} {{.OUTPUT_PATH}}

  build:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - zig build-exe ../main-sqlite.zig -femit-bin=main-sqlite -lc -fstrip -O ReleaseSmall -mcpu=baseline

  debug:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - zig build-exe ../main-sqlite.zig -femit-bin=main-sqlite -lc -O Debug

  run:
    dir: "{{.OUTPUT_PATH}}"
    cmd: ./main-sqlite

  test:
    dir: "{{.OUTPUT_PATH}}"
    cmd: ./main-sqlite
